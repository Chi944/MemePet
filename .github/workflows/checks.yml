name: Checks

# Runs the same commands documented in docs/DEV_SETUP.md. If a command here
# drifts from that file, the file is wrong — fix it rather than weakening this.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify counter evidence helper
        run: node --test docs/qa/counter-check.regression.mjs

      - name: Verify local read-recovery harness
        run: node --test docs/qa/rpc-recovery.regression.mjs

      # next/font downloads faces at build time, so this step needs network.
      - name: Build
        run: npm run build

      - name: Install Chromium for simulated browser regression
        run: npx playwright install --with-deps chromium

      - name: SIMULATED wallet browser regression (not genuine wallet acceptance)
        run: npm run test:e2e:simulated

      - name: FICTIONAL development preview browser checks (no wallet actions)
        run: npm run test:e2e:previews

      - name: Verify /dev previews are absent from the production build
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 2
          done
          fail=0
          for path in /dev/pet /dev/landing /dev/community /dev/finale /dev/companion /dev/beta; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path -> $code"
            if [ "$code" != "404" ]; then
              echo "::error::$path returned $code in a production build; it must be 404"
              fail=1
            fi
          done
          home=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
          echo "/ -> $home"
          [ "$home" = "200" ] || { echo "::error::/ returned $home"; fail=1; }
          exit $fail

  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # GitHub Releases intermittently returns 504 for the Foundry download,
      # which fails the job before a single test runs. Retry once after a
      # pause instead of reporting an infrastructure blip as a failing suite.
      - name: Install Foundry
        id: foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        continue-on-error: true
        with:
          version: v1.8.3

      - name: Wait before retrying the Foundry install
        if: steps.foundry.outcome == 'failure'
        run: sleep 45

      - name: Install Foundry (retry)
        if: steps.foundry.outcome == 'failure'
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3

      - name: Report and verify Foundry version
        run: |
          forge --version
          forge --version | head -n 1 | grep -Eq '^forge Version: 1\.8\.3($|[-+[:space:]])'

      # contracts/lib is gitignored and forge-std was installed with --no-git,
      # so the dependency is not in the repository and must be fetched here.
      # forge-std v1.16.2, pinned to the immutable upstream commit.
      - name: Install forge-std
        run: forge install foundry-rs/forge-std@rev=bf647bd6046f2f7da30d0c2bf435e5c76a780c1b --no-git
        working-directory: contracts

      - name: Run contract tests
        run: forge test -vv
        working-directory: contracts
